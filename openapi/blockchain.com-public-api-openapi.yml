openapi: 3.2.0
info:
  title: NFT Market Public API
  description: Backend service for NFT market data.
  version: 1.0.12
servers:
- url: https://api.blockchain.info/nft-market-api
tags:
- name: Public
paths:
  /public/nft/account_assets/{owner_address}/:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Public
      summary: Get public nft account assets by owner address
      x-summary-source: derived
      operationId: getPublicNftAccountAssetsByOwnerAddress
      x-operation-id-source: derived
  /public/nft/v2/account_assets/{owner_address}/:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Public
      summary: Get public nft account assets by owner address
      x-summary-source: derived
      operationId: getPublicNftV2AccountAssetsByOwnerAddress
      x-operation-id-source: derived
  /public/nft/v2/asset/{network}/{contract_address}/{token_id}/:
    get:
      responses:
        '200':
          description: Default Response
      tags:
      - Public
      summary: Get public nft asset by network by contract address by token id
      x-summary-source: derived
      operationId: getPublicNftV2AssetByNetworkByContractAddressByTokenId
      x-operation-id-source: derived
