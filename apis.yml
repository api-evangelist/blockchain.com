apis:
- name: Blockchain.com Exchange WebSocket API
  description: >-
    Real-time WebSocket gateway for the Blockchain.com Exchange. Anonymous channels stream heartbeat,
    L2/L3 order books, prices, symbols, ticker and trades; authenticated channels cover auth, balances
    and FIX 4.2-named trading messages (NewOrderSingle, CancelOrderRequest, OrderMassCancelRequest, OrderMassStatusRequest).
  humanURL: https://exchange.blockchain.com/api/
  baseURL: wss://ws.blockchain.info/mercury-gateway/v1/ws
  tags:
  - cryptocurrency
  - exchange
  - trading
  - streaming
  - websocket
  properties:
  - type: Documentation
    url: https://exchange.blockchain.com/api/
  - type: SourceCode
    url: https://github.com/blockchain/docs-exchange-api
  - type: Webhooks
    url: asyncapi/blockchain.com-event-surface.yml
- name: Blockchain Data API
  description: >-
    Free JSON API over the Blockchain.com Explorer data set — single blocks, transactions, addresses,
    unspent outputs, block height and latest block queries for Bitcoin.
  humanURL: https://www.blockchain.com/explorer/api/blockchain_api
  baseURL: https://blockchain.info
  tags:
  - bitcoin
  - blockchain
  - block-explorer
  - market-data
  properties:
  - type: Documentation
    url: https://www.blockchain.com/explorer/api/blockchain_api
- name: Blockchain.com Simple Query API
  description: >-
    Plain-text query API returning single values for blockchain statistics such as block count, difficulty,
    hash rate, total bitcoins in circulation, market cap and address balances.
  humanURL: https://www.blockchain.com/explorer/api/q
  baseURL: https://blockchain.info/q
  tags:
  - bitcoin
  - blockchain
  - block-explorer
  properties:
  - type: Documentation
    url: https://www.blockchain.com/explorer/api/q
- name: Blockchain.com Exchange Rates API
  description: >-
    Ticker and currency-conversion API returning bitcoin exchange rates across major fiat currencies,
    aggregated from the major exchanges.
  humanURL: https://www.blockchain.com/explorer/api/exchange_rates_api
  baseURL: https://blockchain.info/ticker
  tags:
  - market-data
  - cryptocurrency
  - bitcoin
  properties:
  - type: Documentation
    url: https://www.blockchain.com/explorer/api/exchange_rates_api
- name: Blockchain.com Charts and Statistics API
  description: >-
    JSON/CSV feed behind the Blockchain.com charts and stats pages — per-chart time series, network statistics,
    and mining pool distribution.
  humanURL: https://www.blockchain.com/explorer/api/charts_api
  baseURL: https://api.blockchain.info/charts
  tags:
  - market-data
  - blockchain
  - bitcoin
  - statistics
  properties:
  - type: Documentation
    url: https://www.blockchain.com/explorer/api/charts_api
- name: Blockchain.com Explorer WebSocket API
  description: >-
    Low-latency streaming socket channel providing notifications on new bitcoin blocks, unconfirmed transactions
    and watched addresses via the unconfirmed_sub, blocks_sub and addr_sub subscription operations.
  humanURL: https://www.blockchain.com/explorer/api/api_websocket
  baseURL: wss://ws.blockchain.info/inv
  tags:
  - bitcoin
  - blockchain
  - streaming
  - websocket
  properties:
  - type: Documentation
    url: https://www.blockchain.com/explorer/api/api_websocket
  - type: Webhooks
    url: asyncapi/blockchain.com-event-surface.yml
- name: Blockchain.com NFT Market API
  description: >-
    Public backend service for NFT market data, returning NFT assets owned by an address and individual
    asset lookups by network, contract address and token id. Publishes a Swagger 2.0 definition at its
    documentation endpoint.
  humanURL: https://api.blockchain.com/nft-market-api/documentation/
  baseURL: https://api.blockchain.com/nft-market-api
  tags:
  - nft
  - blockchain
  - market-data
  properties:
  - type: Swagger
    url: openapi/_original/blockchain.com-nft-market-api-swagger.json
  - type: Documentation
    url: https://api.blockchain.com/nft-market-api/documentation/
- name: Blockchain.com OAuth Resources API
  description: >-
    OAuth 2.0 resource gateway that lets a third-party app read a consenting user's Blockchain.com custodial
    wallet data. Two endpoints are documented — transaction history (scope read_transactions, up to 30
    days) and balances (scope read_balance) — accessed with a bearer access token.
  humanURL: https://docs.blockchain.com/oauth-resources
  baseURL: https://api.blockchain.info/partner-resource-gateway
  tags:
  - oauth
  - wallet
  - cryptocurrency
  - fintech
  properties:
  - type: Documentation
    url: https://docs.blockchain.com/oauth-resources
  - type: OAuthScopes
    url: scopes/blockchain.com-scopes.yml
  - type: Authentication
    url: authentication/blockchain.com-authentication.yml
- name: Blockchain.com Wallet API
  description: >-
    Open-source Wallet API service (service-my-wallet-v3) that runs locally and exposes HTTP endpoints
    for creating wallets, sending payments, and checking balances against Blockchain.com wallets, plus
    the Receive Payments V2 API for generating per-invoice receive addresses.
  humanURL: https://github.com/blockchain/service-my-wallet-v3
  baseURL: https://api.blockchain.info/v2
  tags:
  - wallet
  - payments
  - bitcoin
  properties:
