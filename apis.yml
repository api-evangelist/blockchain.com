aid: blockchain.com
name: Blockchain.com
description: >-
  Blockchain.com is a cryptocurrency financial services company that operates the
  Blockchain.com Explorer (one of the longest-running Bitcoin block explorers), a
  self-custody and custodial wallet, an institutional spot exchange, and
  Blockchain.com Pay, an embeddable fiat-to-crypto on-ramp and off-ramp for
  partners. Its public API surface spans the Exchange REST API (market data,
  trading, deposits and withdrawals, authenticated with an X-API-Token header),
  a FIX-named WebSocket trading and market-data gateway, the Pay Partner API
  (eligibility, quotes and orders, authenticated with public and private API key
  headers plus order webhooks), the free Blockchain Data, Simple Query, Exchange
  Rates and Charts & Statistics APIs on blockchain.info, a real-time blockchain
  WebSocket notification stream, an NFT Market API, and the open-source Wallet
  API service (service-my-wallet-v3) with first-party client libraries for
  Python, Node.js, Ruby, PHP and Java.
image: https://www.blockchain.com/static/apple-touch-icon.png
url: https://raw.githubusercontent.com/api-evangelist/blockchain.com/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-02'
modified: '2026-08-02'
