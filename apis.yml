  description: Real-time WebSocket APIs covering two distinct surfaces — the Bitcoin / blockchain.info explorer
    socket (unconfirmed transactions, new blocks, per-address activity) and the Blockchain.com Exchange mercury-gateway
    socket (heartbeat, ticker, L2/L3 order books, prices, symbols, trades, plus authenticated balances and trading).
  humanURL: https://www.blockchain.com/explorer/api/api_websocket
