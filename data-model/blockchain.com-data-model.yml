id_conventions:
- domain: exchange
  ids: >-
    exOrdId and gwOrderId are integers assigned by the exchange; clOrdId is a
    client-supplied string of at most 20 characters; depositId, withdrawalId and
    whitelistId are opaque strings.
- domain: pay
  ids: >-
    orderId, eventId and userId are UUIDs; externalReference (100 chars) and
    subPartnerId (50 chars) are partner-supplied strings.
